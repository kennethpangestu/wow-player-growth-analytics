[project]
name = "wow-player-growth-analytics"
version = "1.0.0"
description = "Growth analytics on 3 years of World of Warcraft player telemetry (WoWAH dataset)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
